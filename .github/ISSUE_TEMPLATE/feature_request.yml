name: 改善提案
description: 機能や使いやすさの改善案を提案します。
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Issueは公開されます。氏名、メールアドレス、顧客情報、未公開URLなどの個人情報・機密情報を書かないでください。
  - type: checkboxes
    id: privacy_confirmation
    attributes:
      label: 公開前の確認
      options:
        - label: 本文・URL・画像に個人情報や機密情報を含めていません。
          required: true
  - type: textarea
    id: situation
    attributes:
      label: 困っていること・利用場面
      description: どのような場面で、何に困っているかを書いてください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望する改善
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 現在の代替方法
      description: 今はどのように対応しているか、あれば記載してください。
